<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>사용자 관리 · 재고노트</title><link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header><strong>▦ 재고노트 <small>관리자</small></strong><a href="/">재고관리로 이동 ↗</a></header>
  <main>
    <h1>사용자 관리</h1><p>계정을 등록하고 로그인 정보를 관리하세요.</p>
    <div id="message" role="status" aria-live="polite"></div>
    <section id="login-panel" class="card login">
      <h2>관리자 로그인</h2><p>관리자로 지정된 이메일 계정만 사용할 수 있습니다.</p>
      <form id="login-form"><label for="email">아이디 (이메일)</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" class="primary">로그인</button></form>
    </section>
    <section id="admin-panel" hidden>
      <div class="session"><span id="admin-email"></span><button id="logout">로그아웃</button></div>
      <div class="layout">
        <section class="card"><h2 id="form-title">사용자 등록</h2><p>아이디는 이메일을 사용합니다.</p>
          <form id="user-form"><fieldset id="editor"><label for="user-email">아이디 (이메일)</label><input id="user-email" type="email" autocomplete="off" required maxlength="254"><label for="user-password">새 비밀번호</label><input id="user-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><small id="password-help">12~128자로 입력하세요. 기존 비밀번호는 조회할 수 없습니다.</small><button class="primary" id="save-user">계정 만들기</button><button id="cancel-edit" type="button" hidden>수정 취소</button></fieldset></form>
        </section>
        <section class="card"><div class="toolbar"><h2>등록된 사용자</h2><button id="refresh">새로고침</button></div>
          <div class="table-wrap"><table><thead><tr><th>아이디</th><th>권한 / 상태</th><th>관리</th></tr></thead><tbody id="users"></tbody></table></div>
          <div class="pagination"><button id="previous">이전</button><span id="page-label"></span><button id="next">다음</button></div>
          <p class="note">관리자 계정은 이 화면에서 사용 중지할 수 없습니다. 관리자 지정은 서버 환경변수에서 관리합니다.</p>
        </section>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script><script src="/admin.js"></script>
</body>
</html>
