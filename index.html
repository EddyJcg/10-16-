<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>재고노트 · 재고관리</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#20342e;background:#f4f7f5;line-height:1.5;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83cbb3;outline-offset:3px}
    header{background:#163e32;color:white;padding:25px max(24px,calc((100% - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;font-size:23px;letter-spacing:-1px}.brand span{color:#a9c9bb;font-size:13px;font-weight:400;margin-left:14px;letter-spacing:0}.local{font-size:12px;border:1px solid #537366;border-radius:20px;padding:6px 12px;color:#d7e9e0}
    main{max-width:1208px;margin:auto;padding:38px 24px 60px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 6px}p{margin:0;color:#6b7c73}.date{font-size:13px;color:#6b7c73}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stat,.panel{background:white;border:1px solid #dfe7e1;border-radius:14px}.stat{padding:21px 23px}.stat span{font-size:13px;color:#687c70}.stat strong{display:block;font-size:30px;margin-top:7px;letter-spacing:-1px}.stat small{font-size:14px;font-weight:400;margin-left:5px}.stat.warn strong{color:#b56724}
    .layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}.panel{padding:23px}h2{font-size:17px;margin:0 0 19px}.sub{font-size:12px;margin-top:-12px;margin-bottom:20px}.field{margin-bottom:15px}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,select{width:100%;border:1px solid #d5dfd8;border-radius:7px;padding:10px 11px;background:#fff;color:#20342e;min-width:0}input::placeholder{color:#9aa79f}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{background:#23654e;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;width:100%}.primary:hover{background:#184e3b}.secondary{background:#fff;border:1px solid #d5dfd8;border-radius:7px;padding:8px 12px;color:#496356;font-size:13px}.secondary:hover{background:#f0f5f1}.cancel{width:100%;margin-top:8px}.hidden{display:none!important}.note{font-size:12px;line-height:1.7;margin-top:18px;color:#7a897f}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}.toolbar h2{margin:0}.filters{display:grid;grid-template-columns:minmax(120px,1fr) 135px;gap:10px;margin-bottom:20px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap;font-size:13px}th{font-size:12px;color:#7a897f;background:#f7f9f7;font-weight:500}td,th{padding:14px 10px;border-bottom:1px solid #edf1ed}td:first-child{white-space:normal;min-width:135px;overflow-wrap:anywhere}td strong{display:block;font-size:14px}td small{color:#87958c;font-size:11px}.badge{display:inline-block;font-size:11px;border-radius:20px;padding:4px 9px;background:#eaf5ef;color:#337451}.badge.low{background:#fff1e2;color:#a8621d}.qty{display:flex;align-items:center;gap:9px}.qty button{border:1px solid #dce5dd;background:white;border-radius:5px;width:25px;height:27px;color:#456552}.qty button:disabled{opacity:.35;cursor:default}.actions{display:flex;gap:9px}.text-button{border:0;background:none;padding:4px 0;color:#44705c;font-size:12px}.text-button.danger{color:#ad6255}.empty{text-align:center;padding:45px 15px;color:#7a897f}.foot{font-size:12px;color:#89958e;margin-top:18px}.message{min-height:24px;margin:0 0 14px;font-size:13px;color:#23654e}.message.error{color:#b34532}
    @media(max-width:1000px){.layout{grid-template-columns:250px minmax(0,1fr)}.panel{padding:18px}.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:25px}}
    @media(max-width:760px){header{padding:20px}.brand span{display:none}main{padding:26px 16px}.intro{align-items:start}.date{display:none}.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 115px}h1{font-size:26px}.panel{padding:20px}.stat strong{font-size:27px}}
  </style>
</head>
<body>
  <header><div class="brand">▦ 재고노트<span>작은 재고도, 한눈에.</span></div><div class="local">● 브라우저 저장</div></header>
  <main>
    <div class="intro"><div><h1>재고 현황</h1><p>물품을 등록하고 입출고 수량을 간편하게 관리하세요.</p></div><div class="date" id="today"></div></div>
    <section class="stats" aria-label="재고 요약">
      <div class="stat"><span>등록 품목</span><strong id="total-items">0</strong></div>
      <div class="stat"><span>총 재고 수량</span><strong id="total-qty">0</strong></div>
      <div class="stat warn"><span>재고 부족 품목</span><strong id="low-items">0</strong></div>
      <div class="stat"><span>총 재고 금액</span><strong id="total-value">0</strong></div>
    </section>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div class="layout">
      <section class="panel">
        <h2 id="form-title">새 품목 등록</h2><p class="sub">필요한 정보만 입력하면 준비 끝.</p>
        <form id="item-form">
          <div class="field"><label for="name">품목명</label><input id="name" required maxlength="80" placeholder="예: A4 복사용지" autocomplete="off"></div>
          <div class="field"><label for="category">분류</label><select id="category"><option>사무용품</option><option>전자기기</option><option>생활용품</option><option>식품</option><option>기타</option></select></div>
          <div class="pair"><div class="field"><label for="quantity">현재 수량</label><input id="quantity" type="number" required min="0" max="1000000" step="1" value="0"></div><div class="field"><label for="minimum">최소 수량</label><input id="minimum" type="number" required min="0" max="1000000" step="1" value="5"></div></div>
          <div class="field"><label for="price">단가 (원)</label><input id="price" type="number" required min="0" max="1000000000" step="1" value="0"></div>
          <button class="primary" id="save-button" type="submit">＋ 품목 등록</button>
          <button class="secondary cancel hidden" id="cancel-edit" type="button">수정 취소</button>
        </form>
        <p class="note">현재 수량이 최소 수량 이하면 재고 부족으로 표시됩니다. 수량의 − / + 버튼으로 1개씩 출고·입고할 수 있습니다.</p>
      </section>
      <section class="panel">
        <div class="toolbar"><h2>품목 목록 <span id="list-count" style="color:#819489;font-weight:400"></span></h2><button class="secondary" id="export" type="button">↓ CSV 내보내기</button></div>
        <div class="filters"><input id="search" type="search" aria-label="품목명 검색" placeholder="품목명으로 검색"><select id="filter" aria-label="재고 상태 필터"><option value="all">전체 상태</option><option value="low">재고 부족</option><option value="ok">재고 충분</option></select></div>
        <div class="table-wrap"><table><thead><tr><th scope="col">품목 / 분류</th><th scope="col">현재 수량</th><th scope="col">단가</th><th scope="col">상태</th><th scope="col">관리</th></tr></thead><tbody id="items"></tbody></table></div>
        <p class="foot">데이터는 이 브라우저에만 저장됩니다. 보관하려면 CSV로 내보내세요.</p>
      </section>
    </div>
  </main>
  <script>
    'use strict';
    const KEY = 'inventory-note-v1';
    const $ = id => document.getElementById(id);
    const categories = ['사무용품','전자기기','생활용품','식품','기타'];
    const number = value => value.toLocaleString('ko-KR');
    let editing = null;
    let items = [];
    function notify(text, error = false) { $('message').textContent = text; $('message').classList.toggle('error', error); }
    function validItem(item) {
      return item && typeof item.id === 'string' && typeof item.name === 'string' && item.name.trim().length > 0 && item.name.length <= 80 && categories.includes(item.category) &&
        ['quantity','minimum','price'].every(key => Number.isSafeInteger(item[key]) && item[key] >= 0 && item[key] <= (key === 'price' ? 1000000000 : 1000000));
    }
    try {
      const raw = localStorage.getItem(KEY);
      if (raw !== null) {
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved) || !saved.every(validItem) || new Set(saved.map(item => item.id)).size !== saved.length) throw new Error('invalid data');
        items = saved;
      }
    } catch { notify('저장된 데이터를 읽을 수 없습니다. 브라우저 저장 설정을 확인해 주세요.', true); }
    function persist(next) {
      try { localStorage.setItem(KEY, JSON.stringify(next)); items = next; render(); return true; }
      catch { notify('저장하지 못했습니다. 브라우저의 저장 공간과 권한을 확인해 주세요.', true); return false; }
    }
    function resetForm() { editing = null; $('item-form').reset(); $('form-title').textContent = '새 품목 등록'; $('save-button').textContent = '＋ 품목 등록'; $('cancel-edit').classList.add('hidden'); }
    function render() {
      $('total-items').textContent = number(items.length);
      $('total-qty').textContent = number(items.reduce((sum,item) => sum + item.quantity, 0));
      $('low-items').textContent = number(items.filter(item => item.quantity <= item.minimum).length);
      $('total-value').textContent = number(items.reduce((sum,item) => sum + item.quantity * item.price, 0)) + '원';
      const query = $('search').value.trim().toLocaleLowerCase('ko-KR');
      const shown = items.filter(item => item.name.toLocaleLowerCase('ko-KR').includes(query) && ($('filter').value === 'all' || (item.quantity <= item.minimum) === ($('filter').value === 'low')));
      $('list-count').textContent = shown.length + '개';
      $('items').replaceChildren();
      if (!shown.length) {
        const row = document.createElement('tr'); const cell = document.createElement('td');
        cell.colSpan = 5; cell.className = 'empty'; cell.textContent = items.length ? '검색 조건에 맞는 품목이 없습니다.' : '아직 등록된 품목이 없습니다. 첫 품목을 등록해 보세요.';
        row.append(cell); $('items').append(row);
      }
      shown.forEach(item => {
        const row = document.createElement('tr');
        // 사용자 입력은 textContent로 넣어 HTML 실행을 방지합니다.
        const info = document.createElement('td'); const title = document.createElement('strong'); const category = document.createElement('small');
        title.textContent = item.name; category.textContent = item.category; info.append(title,category);
        const qtyCell = document.createElement('td'); const qty = document.createElement('div'); qty.className = 'qty';
        function control(label, text, handler, disabled = false) { const button = document.createElement('button'); button.type = 'button'; button.textContent = text; button.setAttribute('aria-label', item.name + ' ' + label); button.disabled = disabled; button.addEventListener('click', handler); return button; }
        const count = document.createElement('span'); count.textContent = number(item.quantity);
        qty.append(control('1개 출고','−',() => changeQuantity(item.id,-1),item.quantity === 0),count,control('1개 입고','+',() => changeQuantity(item.id,1),item.quantity === 1000000)); qtyCell.append(qty);
        const price = document.createElement('td'); price.textContent = number(item.price) + '원';
        const state = document.createElement('td'); const badge = document.createElement('span'); const low = item.quantity <= item.minimum;
        badge.className = 'badge' + (low ? ' low' : ''); badge.textContent = low ? '재고 부족' : '충분'; state.append(badge);
        const actions = document.createElement('td'); const buttons = document.createElement('div'); buttons.className = 'actions';
        const edit = control('수정','수정',() => editItem(item.id)); edit.className = 'text-button';
        const remove = control('삭제','삭제',() => { if (confirm('“' + item.name + '” 품목을 삭제할까요?') && persist(items.filter(entry => entry.id !== item.id))) { if (editing === item.id) resetForm(); notify('품목을 삭제했습니다.'); } }); remove.className = 'text-button danger';
        buttons.append(edit,remove); actions.append(buttons); row.append(info,qtyCell,price,state,actions); $('items').append(row);
      });
    }
    function changeQuantity(id, delta) {
      const item = items.find(entry => entry.id === id);
      if (!item || item.quantity + delta < 0 || item.quantity + delta > 1000000) return;
      if (persist(items.map(entry => entry.id === id ? {...entry, quantity: entry.quantity + delta} : entry))) {
        if (editing === id) $('quantity').value = item.quantity + delta;
        notify(item.name + (delta > 0 ? ' 1개를 입고했습니다.' : ' 1개를 출고했습니다.'));
      }
    }
    function editItem(id) {
      const item = items.find(entry => entry.id === id); editing = id;
      ['name','category','quantity','minimum','price'].forEach(key => $(key).value = item[key]);
      $('form-title').textContent = '품목 수정'; $('save-button').textContent = '변경 사항 저장'; $('cancel-edit').classList.remove('hidden'); $('name').focus();
    }
    $('item-form').addEventListener('submit', event => {
      event.preventDefault();
      const item = {id: editing || (Date.now().toString(36) + Math.random().toString(36).slice(2)), name: $('name').value.trim(), category: $('category').value, quantity: Number($('quantity').value), minimum: Number($('minimum').value), price: Number($('price').value)};
      if (!validItem(item)) { notify('품목명과 수량, 단가를 올바르게 입력해 주세요.',true); return; }
      const isEdit = editing !== null;
      if (persist(isEdit ? items.map(entry => entry.id === editing ? item : entry) : [...items,item])) { resetForm(); notify(isEdit ? '품목을 수정했습니다.' : '새 품목을 등록했습니다.'); }
    });
    $('cancel-edit').addEventListener('click',resetForm);
    $('search').addEventListener('input',render); $('filter').addEventListener('change',render);
    $('export').addEventListener('click',() => {
      if (!items.length) { notify('내보낼 품목을 먼저 등록해 주세요.'); return; }
      const csvCell = value => '"' + String(value).replace(/^[=+@\-\t\r]/, "'$&").replaceAll('"','""') + '"';
      const rows = [['품목명','분류','현재 수량','최소 수량','단가(원)'],...items.map(item => [item.name,item.category,item.quantity,item.minimum,item.price])];
      const url = URL.createObjectURL(new Blob(['\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}));
      const link = document.createElement('a'); link.href = url; link.download = '재고목록-' + new Date().toLocaleDateString('sv-SE') + '.csv'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000);
      notify('전체 품목을 CSV로 내보냈습니다.');
    });
    $('today').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    render();
  </script>
</body>
</html>
