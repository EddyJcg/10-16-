<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 격려</title>
  <style>
    :root {
      --bg1: #ffecd2;
      --bg2: #fcb69f;
      --card: #ffffff;
      --text: #333333;
      --accent: #ff7a59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 240px;
      padding: 20px 14px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.1rem; }
    #message {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: keep-all;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #message.hide { opacity: 0; transform: translateY(8px); }
    button {
      margin-top: 12px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 122, 89, 0.4); }
    button:active { transform: translateY(0); }
    #count { margin-top: 8px; font-size: 0.75rem; color: #888; }
    body.popup-only {
      min-height: 0;
      height: 100vh;
      padding: 8px;
      background: transparent;
    }
    body.popup-large .card {
      zoom: 2;
    }
    .heart {
      position: fixed;
      pointer-events: none;
      color: #e60023;
      z-index: 999;
      animation: flutter 3s ease-out forwards;
    }
    @keyframes flutter {
      0%   { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.3); opacity: 0; }
    }
  </style>
</head>

    <button id="btn">격려 받기</button>
    <div id="count"></div>

    const msgEl = document.getElementById("message");
    const countEl = document.getElementById("count");
    const btn = document.getElementById("btn");

    let order = [];
    let index = 0;

    // 문구를 섞어서 모든 문구가 한 번씩 나온 뒤 다시 섞음
    function shuffle() {
      order = messages.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      index = 0;
    }
    shuffle();
    const loginMode = window.parent !== window && new URLSearchParams(window.location.search).get("mode") === "login";
    if (loginMode) {
      document.body.classList.add("popup-only");
      if (window.parent.matchMedia("(min-width: 768px)").matches) document.body.classList.add("popup-large");
      msgEl.textContent = messages[order[index++]];
      countEl.textContent = "환영합니다!";
    }

    // 버튼을 누를 때마다 빨간 하트 1개가 흩날림
    function spawnHeart() {
      const rect = btn.getBoundingClientRect();
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤";
      heart.style.left = rect.left + rect.width / 2 + "px";
      heart.style.top = rect.top + "px";
      heart.style.fontSize = 24 + Math.random() * 20 + "px";
      heart.style.setProperty("--dx", (Math.random() - 0.5) * 400 + "px");
      heart.style.setProperty("--dy", -(200 + Math.random() * 300) + "px");
      heart.style.setProperty("--rot", (Math.random() - 0.5) * 120 + "deg");
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    btn.addEventListener("click", () => {
      if (loginMode) {
        window.parent.postMessage({ type: "login-welcome-confirm" }, "*");
        return;
      }
      spawnHeart();
      if (index >= order.length) shuffle();
      const text = messages[order[index]];
      index++;

      msgEl.classList.add("hide");
      setTimeout(() => {
        msgEl.textContent = text;
        msgEl.classList.remove("hide");
        countEl.textContent = `${index} / ${messages.length}`;
      }, 300);
    });

</html>
