<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 격려</title>
  <style>
    :root {
      --bg1: #ffecd2;
      --bg2: #fcb69f;
      --card: #ffffff;
      --text: #333333;
      --accent: #ff7a59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 240px;
      padding: 20px 14px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.1rem; }
    #message {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: keep-all;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #message.hide { opacity: 0; transform: translateY(8px); }
    button {
      margin-top: 12px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 122, 89, 0.4); }
    button:active { transform: translateY(0); }
    #count { margin-top: 8px; font-size: 0.75rem; color: #888; }
    .heart {
      position: fixed;
      pointer-events: none;
      color: #e60023;
      z-index: 999;
      animation: flutter 3s ease-out forwards;
    }
    @keyframes flutter {
      0%   { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌱 오늘의 격려</h1>
    <div id="message">버튼을 눌러 격려 한마디를 받아보세요!</div>
    <button id="btn">격려 받기</button>
    <div id="count"></div>
  </div>

  <script>
    const messages = [
      "오늘도 정말 잘하고 있어요! 💪",
      "작은 한 걸음도 앞으로 나아가는 거예요.",
      "당신은 생각보다 훨씬 강한 사람이에요.",
      "실수해도 괜찮아요. 그만큼 배우고 있다는 뜻이니까요.",
      "포기하지 않는 당신이 멋져요! ✨",
      "지금의 노력은 반드시 빛을 볼 거예요.",
      "천천히 가도 괜찮아요. 멈추지만 않으면 돼요.",
      "오늘 하루도 수고 많았어요. 🌙",
      "당신의 존재 자체가 누군가에게 힘이 돼요.",
      "할 수 있어요! 당신을 믿어요. 🌟",
      "어제보다 조금 더 나아진 오늘이면 충분해요.",
      "잠시 쉬어가는 것도 용기예요. ☕"
    ];

    const msgEl = document.getElementById("message");
    const countEl = document.getElementById("count");
    const btn = document.getElementById("btn");

    let order = [];
    let index = 0;

    // 문구를 섞어서 모든 문구가 한 번씩 나온 뒤 다시 섞음
    function shuffle() {
      order = messages.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      index = 0;
    }
    shuffle();
    const loginMode = window.parent !== window && new URLSearchParams(window.location.search).get("mode") === "login";
    if (loginMode) {
      msgEl.textContent = messages[order[index++]];
      btn.hidden = true;
      countEl.textContent = "환영합니다! 3초 후 자동으로 로그인합니다.";
    }

    // 버튼을 누를 때마다 빨간 하트 1개가 흩날림
    function spawnHeart() {
      const rect = btn.getBoundingClientRect();
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤";
      heart.style.left = rect.left + rect.width / 2 + "px";
      heart.style.top = rect.top + "px";
      heart.style.fontSize = 24 + Math.random() * 20 + "px";
      heart.style.setProperty("--dx", (Math.random() - 0.5) * 400 + "px");
      heart.style.setProperty("--dy", -(200 + Math.random() * 300) + "px");
      heart.style.setProperty("--rot", (Math.random() - 0.5) * 120 + "deg");
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    btn.addEventListener("click", () => {
      if (loginMode) return;
      spawnHeart();
      if (index >= order.length) shuffle();
      const text = messages[order[index]];
      index++;

      msgEl.classList.add("hide");
      setTimeout(() => {
        msgEl.textContent = text;
        msgEl.classList.remove("hide");
        countEl.textContent = `${index} / ${messages.length}`;
      }, 300);
    });
  </script>
</body>
</html>
