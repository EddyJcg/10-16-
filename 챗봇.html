<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isummery - isummerly 비서</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 15px;
      color: #1d1c1d;
      background: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 화면 틀: 처음에는 9:16 비율이며, 가장자리를 드래그해 크기를 조절 */
    .app-frame {
      position: absolute;
      display: flex;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
    }

    /* 대시보드 팝업 안에서는 부모 창이 크기를 정하므로 화면 틀이 iframe 전체를 채웁니다. */
    html.embedded .app-frame {
      position: fixed;
      inset: 0;
      box-shadow: none;
    }

    /* 팝업의 닫기 버튼(×)이 모델 배지를 가리지 않도록 헤더 오른쪽 여백을 늘립니다. */
    html.embedded .chat-header {
      padding-right: 48px;
    }

    .resize-handle {
      position: absolute;
      z-index: 10;
    }

    .rh-n, .rh-s { left: 12px; right: 12px; height: 6px; cursor: ns-resize; }
    .rh-n { top: 0; }
    .rh-s { bottom: 0; }
    .rh-e, .rh-w { top: 12px; bottom: 12px; width: 6px; cursor: ew-resize; }
    .rh-e { right: 0; }
    .rh-w { left: 0; }
    .rh-ne, .rh-sw, .rh-nw, .rh-se { width: 12px; height: 12px; }
    .rh-ne { top: 0; right: 0; cursor: nesw-resize; }
    .rh-sw { bottom: 0; left: 0; cursor: nesw-resize; }
    .rh-nw { top: 0; left: 0; cursor: nwse-resize; }
    .rh-se { bottom: 0; right: 0; cursor: nwse-resize; }

    /* 왼쪽 사이드바 */
    .sidebar {
      width: 130.5px;
      min-width: 130.5px;
      background: #3f0e40;
      color: #d1c4d1;
      display: flex;
      flex-direction: column;
    }

    .workspace-header {
      padding: 16px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .company-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .profile {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      color: #d1c4d1;
    }

    .profile-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #36c5f0, #2eb67d);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .menu-section {
      padding: 16px 6px 8px;
      flex: 1;
      overflow-y: auto;
    }

    .menu-title {
      padding: 0 10px 6px;
      font-size: 12px;
      font-weight: 700;
      color: #b9a9b9;
    }

    .menu-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      cursor: pointer;
      color: #d1c4d1;
      font-size: 15px;
      user-select: none;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-item.active {
      background: #1164a3;
      color: #ffffff;
      font-weight: 700;
    }

    .menu-item .hash {
      opacity: 0.7;
    }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 오른쪽 메인 영역 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #ffffff;
    }

    .chat-header {
      padding: 14px 24px;
      border-bottom: 1px solid #e8e8e8;
      background: #ffffff;
    }

    .chat-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .chat-desc {
      margin: 2px 0 0;
      font-size: 13px;
      color: #616061;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 72%;
    }

    .message.ai {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .message.ai .avatar {
      background: linear-gradient(135deg, #36c5f0, #2eb67d);
    }

    .message.user .avatar {
      background: #e01e5a;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.ai .bubble {
      background: #f4f4f4;
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: #1164a3;
      color: #ffffff;
      border-top-right-radius: 4px;
    }

    .message-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #868686;
    }

    .message.user .message-meta {
      text-align: right;
    }

    /* 하단 입력 영역 */
    .chat-input {
      padding: 16px 24px 20px;
      border-top: 1px solid #e8e8e8;
      background: #ffffff;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid #c8c8c8;
      border-radius: 12px;
      padding: 8px 10px;
      background: #ffffff;
    }

    .input-box:focus-within {
      border-color: #1164a3;
      box-shadow: 0 0 0 1px #1164a3;
    }

    .input-box textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 160px;
      min-height: 24px;
      padding: 4px 2px;
    }

    .send-btn {
      border: none;
      border-radius: 8px;
      background: #007a5a;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #006a4e;
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      color: #868686;
    }

    /* 사이드바 하단 버튼 (추후 설정·저장 버튼 자리) */
    .sidebar-btn {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      background: transparent;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }

    .sidebar-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .chat-header {
      cursor: move;
      user-select: none;
      touch-action: none;
    }

    .chat-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .model-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .model-select {
      max-width: 170px;
      font: inherit;
      font-size: 11px;
      color: #1164a3;
      background: #fff;
      border: 1px solid #bcd6ee;
      border-radius: 6px;
      padding: 2px 4px;
    }

    .model-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: #1164a3;
      background: #e8f1fa;
      border: 1px solid #bcd6ee;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .bubble.typing {
      color: #868686;
      font-style: italic;
    }

    .bubble.error {
      color: #c62828;
    }

    .auth-status {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>
  <div class="app-frame">
  <!-- 왼쪽: 메뉴 목록 -->
  <aside class="sidebar">
    <div class="workspace-header">
      <div>
        <div class="company-name">Isummery</div>
        <div class="profile">
          <span class="profile-icon">i</span>
          <span>isummerly 비서</span>
        </div>
      </div>
    </div>

    <nav class="menu-section">
      <div class="menu-title">메뉴</div>
      <ul class="menu-list">
        <li class="menu-item active" data-menu="general">
          <span class="hash">#</span>
          <span>일반 대화</span>
        </li>
      </ul>
    </nav>

    <!-- 왼쪽 아래: 설정·저장 버튼이 들어갈 자리 -->
    <div class="sidebar-footer" id="sidebarFooter">
      <p class="auth-status" id="authStatus"></p>
    </div>
  </aside>

  <!-- 오른쪽: 머리글 · 대화창 · 입력창 -->
  <main class="main">
    <header class="chat-header">
      <div class="chat-title-row">
        <h1 class="chat-title" id="menuTitle">일반 대화</h1>
        <div class="model-controls">
          <select class="model-select" id="modelSelect" aria-label="AI 모델 선택">
            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
            <option value="gemini-4-hydrogen">gemini-4-hydrogen</option>
            <option value="gemini-3.8-flash">gemini-3.8-flash</option>
            <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
            <option value="gemma-4-31b-it">gemma-4-31b-it</option>
            <option value="gemma-4-26b-a4b-it">gemma-4-26b-a4b-it</option>
          </select>
          <span class="model-badge" id="modelBadge"></span>
        </div>
      </div>
      <p class="chat-desc" id="menuDesc">무엇이든 편하게 물어보세요. 업무에 필요한 내용을 도와드립니다.</p>
    </header>

    <section class="chat-body" id="chatBody">
      <div class="message ai">
        <div class="avatar">AI</div>
        <div>
          <div class="bubble">안녕하세요!           저는 isummerly 비서입니다. 무엇을 도와드릴까요?</div>
                    <div class="message-meta">isummerly 비서</div>
        </div>
      </div>
    </section>

    <footer class="chat-input">
      <div class="input-box">
        <textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button class="send-btn" id="sendBtn" type="button">보내기</button>
      </div>
      <div class="hint">Enter로 전송하고, Shift + Enter로 줄을 바꿀 수 있습니다.</div>
    </footer>
  </main>

  </div>

  <script>
    (function () {
      const chatBody = document.getElementById('chatBody');
      const input = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function currentTime() {
        const now = new Date();
        return pad(now.getHours()) + ':' + pad(now.getMinutes());
      }

      function appendMessage(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '나' : 'AI';

        const content = document.createElement('div');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = (role === 'user' ? '나' : 'isummerly 비서') + ' · ' + currentTime();

        content.appendChild(bubble);
        content.appendChild(meta);
        wrapper.appendChild(avatar);
        wrapper.appendChild(content);
        chatBody.appendChild(wrapper);
        chatBody.scrollTop = chatBody.scrollHeight;
        return { bubble: bubble, meta: meta };
      }

      const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
      // API 키는 서버(Vercel 환경변수)에만 있고, 브라우저는 대시보드 로그인 토큰으로 프록시를 호출합니다.
      const API_URL = '/api/gemini-chat';
      const SESSION_KEY = 'inventory-note-stock-session';
      const authStatus = document.getElementById('authStatus');
      const modelSelect = document.getElementById('modelSelect');
      const modelBadge = document.getElementById('modelBadge');

      // 대화 기록: 요청마다 전체를 보내 이전 대화를 기억하게 함
      const conversation = [];
      let pending = false;

      function accessToken() {
        try {
          const session = JSON.parse(window.sessionStorage.getItem(SESSION_KEY) || 'null');
          if (!session || !session.access_token) return '';
          if (session.expires_at && session.expires_at * 1000 < Date.now()) return '';
          return session.access_token;
        } catch {
          return '';
        }
      }

      function extractReply(data) {
        const candidate = data.candidates && data.candidates[0];
        const parts = candidate && candidate.content && candidate.content.parts;
        if (!parts) return '';
        return parts.map(function (part) { return part.text || ''; }).join('').trim();
      }

      async function requestReply() {
        const token = accessToken();
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ model: modelSelect.value, contents: conversation })
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          throw new Error(data.error || ('요청 실패 (HTTP ' + response.status + ')'));
        }
        return data.text || '';
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text || pending) return;
        if (!accessToken()) {
          authStatus.textContent = '로그인 후 다시 시도하세요. 대시보드에서 로그인하면 자동으로 연결됩니다.';
          return;
        }

        appendMessage('user', text);
        conversation.push({ role: 'user', parts: [{ text: text }] });
        input.value = '';
        input.style.height = 'auto';

        pending = true;
        sendBtn.disabled = true;
        const reply = appendMessage('ai', '입력 중...');
        reply.bubble.classList.add('typing');

        try {
          const answer = await requestReply();
          if (!answer) throw new Error('응답을 받지 못했습니다. 다시 시도해 주세요.');
          conversation.push({ role: 'model', parts: [{ text: answer }] });
          reply.bubble.classList.remove('typing');
          reply.bubble.textContent = answer;
        } catch (error) {
          conversation.pop();
          reply.bubble.classList.remove('typing');
          reply.bubble.classList.add('error');
          reply.bubble.textContent = '오류: ' + error.message;
        } finally {
          reply.meta.textContent = 'isummerly 비서 · ' + currentTime();
          pending = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      modelSelect.value = DEFAULT_MODEL;
      modelBadge.textContent = modelSelect.value;
      modelSelect.addEventListener('change', function () {
        modelBadge.textContent = modelSelect.value;
      });
      if (!accessToken()) {
        authStatus.textContent = '대시보드에서 로그인하면 자동으로 연결됩니다.';
      }

      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage();
        }
      });

      input.addEventListener('input', function () {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      });
    })();

    (function () {
      // 대시보드 팝업(iframe) 안에서는 창 크기와 위치를 부모 창이 맡으므로 여기서는 하지 않습니다.
      if (window.parent !== window) {
        document.documentElement.classList.add('embedded');
        return;
      }
      const frame = document.querySelector('.app-frame');
      const MIN_W = 300;
      const MIN_H = 420;
      const DIRS = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function setRect(left, top, width, height) {
        frame.style.left = left + 'px';
        frame.style.top = top + 'px';
        frame.style.width = width + 'px';
        frame.style.height = height + 'px';
      }

      function initFrame() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const w = Math.min(vw, vh * 9 / 16);
        const h = w * 16 / 9;
        setRect((vw - w) / 2, (vh - h) / 2, w, h);
      }

      function keepInViewport() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const r = frame.getBoundingClientRect();
        const w = Math.min(r.width, vw);
        const h = Math.min(r.height, vh);
        setRect(clamp(r.left, 0, vw - w), clamp(r.top, 0, vh - h), w, h);
      }

      function startResize(event, dir) {
        event.preventDefault();
        const handle = event.currentTarget;
        const start = frame.getBoundingClientRect();
        const startX = event.clientX;
        const startY = event.clientY;
        handle.setPointerCapture(event.pointerId);

        function onMove(e) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          let left = start.left;
          let top = start.top;
          let width = start.width;
          let height = start.height;

          if (dir.includes('e')) {
            width = clamp(start.width + dx, MIN_W, window.innerWidth - start.left);
          }
          if (dir.includes('w')) {
            left = clamp(start.left + dx, 0, start.right - MIN_W);
            width = start.right - left;
          }
          if (dir.includes('s')) {
            height = clamp(start.height + dy, MIN_H, window.innerHeight - start.top);
          }
          if (dir.includes('n')) {
            top = clamp(start.top + dy, 0, start.bottom - MIN_H);
            height = start.bottom - top;
          }
          setRect(left, top, width, height);
        }

        function onUp() {
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onUp);
          handle.removeEventListener('pointercancel', onUp);
        }

        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
      }

      DIRS.forEach(function (dir) {
        const handle = document.createElement('div');
        handle.className = 'resize-handle rh-' + dir;
        handle.addEventListener('pointerdown', function (event) {
          startResize(event, dir);
        });
        frame.appendChild(handle);
      });

      function startMove(event) {
        event.preventDefault();
        const header = event.currentTarget;
        const start = frame.getBoundingClientRect();
        const startX = event.clientX;
        const startY = event.clientY;
        header.setPointerCapture(event.pointerId);

        function onMove(e) {
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const left = clamp(start.left + e.clientX - startX, 0, vw - start.width);
          const top = clamp(start.top + e.clientY - startY, 0, vh - start.height);
          setRect(left, top, start.width, start.height);
        }

        function onUp() {
          header.removeEventListener('pointermove', onMove);
          header.removeEventListener('pointerup', onUp);
          header.removeEventListener('pointercancel', onUp);
        }

        header.addEventListener('pointermove', onMove);
        header.addEventListener('pointerup', onUp);
        header.addEventListener('pointercancel', onUp);
      }

      document.querySelector('.chat-header').addEventListener('pointerdown', startMove);

      initFrame();
      window.addEventListener('resize', keepInViewport);
    })();
  </script>
</body>
</html>
